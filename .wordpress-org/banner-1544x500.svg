<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#615dfa"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23d2e2"/>
      <stop offset="100%" stop-color="#10d876"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1544" height="500" fill="url(#bannerGrad)"/>

  <!-- Decorative glow circles -->
  <circle cx="1350" cy="120" r="280" fill="#615dfa" fill-opacity="0.35"/>
  <circle cx="1450" cy="400" r="220" fill="#23d2e2" fill-opacity="0.25"/>
  <circle cx="120" cy="450" r="200" fill="#7e57c2" fill-opacity="0.2"/>

  <!-- Left Icon & Illustration -->
  <g transform="translate(120, 110)">
    <rect width="280" height="280" rx="56" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <circle cx="140" cy="140" r="90" fill="url(#accentGrad)"/>
    <circle cx="140" cy="140" r="70" fill="#ffffff"/>
    <path d="M125 105 L170 140 L125 175 Z" fill="#615dfa"/>
  </g>

  <!-- Text Header -->
  <g transform="translate(460, 160)">
    <!-- Badge -->
    <rect width="260" height="40" rx="20" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="130" y="25" fill="#23d2e2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">OFFICIAL ADSTN PLUGIN</text>

    <!-- Main Title -->
    <text x="0" y="110" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">ADStn Auto Poster</text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
      Auto-publish &amp; synchronize WordPress articles to ADStn social platform
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 210)">
      <rect width="160" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
      <text x="80" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ OAuth 2.0</text>

      <rect x="175" width="210" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
      <text x="280" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🎯 Smart Templates</text>

      <rect x="400" width="180" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
      <text x="490" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">📊 Live Preview</text>

      <rect x="595" width="180" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
      <text x="685" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🌐 Multilingual</text>
    </g>
  </g>
</svg>
